<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abigail Swallow</title>
  <meta name="description" content="Abigail Swallow's site is being rebuilt.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbfbf8;
      --text: #1a1a17;
      --muted: #6b6b63;
      --rule: #e2e2db;
      --accent: #99ff00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141412;
        --text: #f0f0ea;
        --muted: #9a9a90;
        --rule: #2c2c28;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 400 16px/1.6 Inter, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    main { width: 100%; max-width: 30rem; }
    .mark { width: 40px; height: 40px; display: block; margin-bottom: 40px; }
    h1 {
      font: 400 clamp(2.4rem, 7vw, 3.25rem)/1.1 Newsreader, Georgia, serif;
      letter-spacing: -0.01em;
      margin-bottom: 20px;
    }
    h1 em { font-style: italic; }
    p { color: var(--muted); max-width: 26rem; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .status::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    nav {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--rule);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 24px;
    }
    a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      transition: border-color .15s;
    }
    a:hover, a:focus-visible { border-color: var(--text); }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/favicon.svg" alt="">
    <div class="status">Site in progress</div>
    <h1>Abigail Swallow</h1>
    <p>Site under construction...</p>
    <nav>
    </nav>
  </main>
</body>
</html>
